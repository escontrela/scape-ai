spring.datasource.url=jdbc:sqlite:scapeai.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
server.port=8081
scape.simulation.episode-timeout=PT5M
scape.ai.policy=heuristic-baseline
scape.ai.random-seed=20260309
scape.ai.epsilon=0.15
scape.ai.djl-fallback-confidence-threshold=0.45
scape.metrics.path-entropy-alert-threshold=1.10
scape.training.smoke-run.enabled=true
scape.training.smoke-run.seed=20260309
scape.training.smoke-run.timeout=PT20S
scape.training.smoke-run.min-coverage=0.15
scape.ui.coverage-alert-threshold=0.35
